name = "sejire-sponsor"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
PAYMENT_PROVIDER = "mock"
PUBLISH_PRICE_MINOR = "1500"
PUBLISH_CURRENCY = "KZT"
MAX_ENVELOPE_BYTES = "524288"
# Comma-separated; include local Vite when developing
APP_ORIGIN = "https://azovskaya.github.io,http://localhost:5173,http://127.0.0.1:5173"

# Optional KV for production idempotency (mock uses memory if unset / REPLACE)
# [[kv_namespaces]]
# binding = "IDEMPOTENCY"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_KV_PREVIEW_ID"
